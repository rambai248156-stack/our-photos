<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Photos & Videos — Live Feed</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">
      <span class="brand-mark">O</span>
      Our Photos
    </a>
    <div class="live-label"><i></i> Live Gallery</div>
  </header>

  <main>
    <section class="intro">
      <div>
        <p class="eyebrow">Free Cloud Gallery</p>
        <h1>Share Photos & Videos</h1>
        <p class="lede">Upload any photo or video. It goes live instantly for everyone to see.</p>
      </div>
      <input type="file" id="mediaInput" accept="image/*,video/*" multiple hidden>
      <label for="mediaInput" class="upload-button"><span>+</span> Upload Media</label>
    </section>

    <div id="uploadPanel" class="upload-panel" hidden>
      <div class="upload-head">
        <strong id="uploadName">Uploading...</strong>
        <span id="uploadPercent">0%</span>
      </div>
      <div class="progress-track" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
        <span id="progressFill"></span>
      </div>
      <p id="uploadStatus" class="upload-status"></p>
    </div>

    <div class="gallery-heading">
      <div>
        <p class="eyebrow">Community Feed</p>
        <h2>Latest Uploads</h2>
      </div>
      <span id="itemCount" class="item-count">0 items</span>
    </div>

    <p id="connectionStatus" class="connection-status"></p>
    <div id="gallery" class="gallery"></div>
  </main>

  <footer>Powered by ImageKit & Firebase</footer>
  <div id="toast" class="toast" role="status"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
