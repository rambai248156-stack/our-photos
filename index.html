<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Frames</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#f4f4f5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<main>
  <div id="grid" class="grid"></div>
  <div id="empty" hidden><b>Nothing here yet</b><span>Tap + to add a photo or video</span></div>
  <div id="more"></div>
</main>

<button id="nf" aria-label="Filter photos and videos" data-i="filter"></button>
<button id="fab" aria-label="Upload" data-i="plus"></button>
<nav id="nav"><div class="cap">
  <button id="nh" class="on"><i data-i="home"></i><span>Home</span></button>
  <button id="ns"><i data-i="search"></i><span>Search</span></button>
  <button id="ig" aria-label="Open Instagram"><i data-i="insta"></i><span>Instagram</span></button>
</div></nav>

<section id="search" class="layer" hidden>
  <form id="sf"><button type="button" id="sx" aria-label="Close" data-i="back"></button>
    <label class="pill"><i data-i="search"></i><input id="si" type="search" enterkeyhint="search" autocomplete="off" placeholder="Search by title"></label></form>
  <div id="sg" class="grid"></div>
</section>

<section id="viewer" class="layer" hidden>
  <div id="stage"></div>
  <button id="vx" class="rb" aria-label="Close" data-i="close"></button>
  <div id="vp">
    <div id="vt"></div><div id="vd"></div>
    <div class="acts">
      <button id="vl" aria-label="Like" data-i="heart"></button>
      <button id="vc" aria-label="Comments" data-i="chat"></button>
      <button id="vs" aria-label="Share" data-i="send"></button>
      <button id="vdn" aria-label="Download" data-i="download"></button>
      <button id="vdel" aria-label="Delete" data-i="trash" hidden></button>
    </div>
  </div>
</section>

<div class="sheet" id="add" hidden><i class="bd"></i><div class="box">
  <h3>Upload</h3>
  <button class="row" data-pick="fp"><span data-i="photo"></span><b>Photos</b></button>
  <button class="row" data-pick="fv"><span data-i="video"></span><b>Videos</b></button>
  <button class="row" data-pick="ff"><span data-i="folder"></span><b>Files</b></button>
</div></div>

<div class="sheet" id="flt" hidden><i class="bd"></i><div class="box tiles">
  <button data-f="all"><span data-i="all"></span>All</button>
  <button data-f="photo"><span data-i="photo"></span>Photos</button>
  <button data-f="video"><span data-i="video"></span>Videos</button>
</div></div>

<div class="sheet" id="compose" hidden><i class="bd"></i><div class="box">
  <div class="post">
    <div class="sq" id="prev"></div>
    <div class="txt">
      <div class="fld"><input id="ttl" maxlength="100" placeholder=" " aria-label="Title"><div class="ph">Add a title</div></div>
      <div class="fld"><textarea id="dsc" rows="2" maxlength="500" placeholder=" " aria-label="Description"></textarea>
        <div class="ph">Describe something<span class="dots"><i></i><i></i><i></i></span></div></div>
    </div>
  </div>
  <button id="go" class="big"><span>Upload</span><i data-i="arrow"></i></button>
</div></div>

<div class="sheet" id="cmts" hidden><i class="bd"></i><div class="box">
  <h3>Comments</h3>
  <div id="cl"></div>
  <form id="cf"><input id="ci" maxlength="400" placeholder="Add a comment" autocomplete="off"><button aria-label="Send" data-i="send"></button></form>
</div></div>

<div id="ups"></div>
<div id="toast"></div>
<input id="fp" type="file" accept="image/*" hidden>
<input id="fv" type="file" accept="video/*" hidden>
<input id="ff" type="file" hidden>
<script type="module" src="/app.js"></script>
</body>
</html>
